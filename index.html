<!DOCTYPE html>
<html lang="ms" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistem Monitoring Job E-Perolehan</title>

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/png" href="https://i.postimg.cc/Jzd5bvTC/image.png">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/Jzd5bvTC/image.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Segoe UI"', 'Tahoma', 'Geneva', 'Verdana', 'sans-serif'],
                    },
                    colors: {
                        pbi: {
                            light: '#f3f2f1',
                            dark: '#111111',
                            cardLight: '#ffffff',
                            cardDark: '#252423',
                            primary: '#118dff',
                            success: '#12a89d',
                            warning: '#f2c80f',
                            danger: '#e044a7',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM (pinned stable versions) -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js" crossorigin="anonymous"></script>

    <!-- Recharts (pinned stable version) -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin="anonymous"></script>

    <style>
        html, body, #root {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            transition: background-color 0.3s;
        }

        .pbi-shadow { box-shadow: 0 1.2px 3.6px rgba(0,0,0,0.1), 0 6.4px 14.4px rgba(0,0,0,0.13); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c8c6c4; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #605e5c; }
        ::-webkit-scrollbar-thumb:hover { background: #979593; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.25s ease-in-out; }

        #boot-loader {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: #f3f2f1;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; z-index: 9999;
        }
        #boot-loader .spinner {
            width: 36px; height: 36px; border: 4px solid #d6d6d6;
            border-top-color: #118dff; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-bottom: 12px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #boot-error {
            display: none; position: fixed; inset: 0; background: #fff5f7;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            padding: 32px; box-sizing: border-box; overflow: auto; z-index: 10000;
        }
        #boot-error h2 { color: #b3004a; margin-top: 0; }
        #boot-error pre {
            background: #fff; border: 1px solid #f0c6d6; border-radius: 4px;
            padding: 12px; white-space: pre-wrap; word-break: break-word; font-size: 13px;
        }
    </style>
</head>
<body class="bg-pbi-light dark:bg-pbi-dark text-gray-900 dark:text-gray-100">

    <!-- Loader shown until React actually mounts -->
    <div id="boot-loader">
        <div class="spinner"></div>
        <p style="color:#555; font-size:14px;">Memuatkan dashboard...</p>
    </div>

    <!-- Friendly fallback if a script fails to load -->
    <div id="boot-error">
        <h2>Dashboard tak dapat dimuatkan</h2>
        <p>Detail teknikal:</p>
        <pre id="boot-error-detail"></pre>
    </div>

    <div id="root" class="h-full"></div>

    <script>
        window.addEventListener('error', function (e) {
            var rootEl = document.getElementById('root');
            var mounted = rootEl && rootEl.children.length > 0;
            if (!mounted) {
                document.getElementById('boot-loader').style.display = 'none';
                var box = document.getElementById('boot-error');
                var detail = document.getElementById('boot-error-detail');
                detail.textContent = (e.message || 'Unknown error') + (e.filename ? ('\n at ' + e.filename + ':' + e.lineno) : '');
                box.style.display = 'block';
            }
        });
    </script>

    <script type="text/babel" data-presets="react">
        const { useState, useEffect, useMemo, Component } = React;

        // Safe destructuring with fallback in case Recharts CDN failed
        const Recharts = window.Recharts || {};
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer, PieChart, Pie, Cell } = Recharts;
        const chartsAvailable = Boolean(ResponsiveContainer && BarChart && PieChart);

        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, info) {
                console.error('Dashboard render error:', error, info);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="h-full w-full flex items-center justify-center p-8 bg-pbi-light dark:bg-pbi-dark">
                            <div className="max-w-lg bg-white dark:bg-pbi-cardDark p-6 rounded-sm pbi-shadow border-l-4 border-pbi-danger">
                                <h2 className="text-lg font-bold text-pbi-danger mb-2">Ralat pada dashboard</h2>
                                <p className="text-sm text-gray-600 dark:text-gray-300 mb-3">Sesuatu tak kena semasa memaparkan bahagian ini. Cuba refresh halaman ini.</p>
                                <button onClick={() => window.location.reload()} className="mt-3 px-4 py-2 bg-pbi-primary text-white rounded-sm text-sm hover:bg-blue-600">Refresh Halaman</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const IconDashboard = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>;
        const IconIntake = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" x2="12" y1="18" y2="12"/><line x1="9" x2="15" y1="15" y2="15"/></svg>;
        const IconOperation = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>;
        const IconClaim = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12h4l2-9 5 18 3-10h6"/></svg>;
        const IconUsers = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>;
        const IconMoon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>;
        const IconSun = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>;
        const IconClose = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>;
        const IconMenu = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>;

        const INVOICE_DELIVERY_OPTIONS = ['Online (Portal E-Perolehan)', 'Hand Delivery', 'Pos/Kurier'];

        // Sila masukkan URL Web App Apps Script anda di sini:
        const APPSCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz8Ql6bJgDMLwNn1OyS4msd6ycVv5nxyd5PZMINHchgFPmeKRP0O1B9REEQFJl9R0tp/exec'; 

        // Status Claim helper
        const calculateClaimStatus = (invoiceDate, currentStatus) => {
            if (currentStatus === 'Payment Received') return 'Payment Received';
            if (!invoiceDate) return 'Pending Invoice';
            const diffDays = Math.ceil((new Date() - new Date(invoiceDate)) / (1000 * 60 * 60 * 24));
            return diffDays > 7 ? 'Outstanding' : 'Pending Payment';
        };

        // Fungsi pembersih JSON stringified seperti ["Puan Nafishah"] dari sheet asal
        const cleanArrayString = (str) => {
            if (!str) return '-';
            if (typeof str !== 'string') return String(str);
            try {
                const parsed = JSON.parse(str);
                if (Array.isArray(parsed)) return parsed.join(', '); // Gabungkan dengan koma
                return str;
            } catch(e) {
                return str; // Jika bukan format JSON, papar sahaja teks biasa
            }
        };

        const Modal = ({ isOpen, onClose, title, children, zIndex = "z-50" }) => {
            if (!isOpen) return null;
            return (
                <div className={`fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center p-4 ${zIndex}`}>
                    <div className="bg-pbi-cardLight dark:bg-pbi-cardDark w-full max-w-2xl rounded-sm pbi-shadow flex flex-col max-h-[90vh]">
                        <div className="flex justify-between items-center p-4 border-b border-gray-200 dark:border-gray-700">
                            <h3 className="text-lg font-semibold">{title}</h3>
                            <button onClick={onClose} className="text-gray-500 hover:text-red-500"><IconClose /></button>
                        </div>
                        <div className="p-4 overflow-y-auto flex-1">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const InputGroup = ({ label, type = "text", name, value, onChange, required, options }) => (
            <div className="mb-4">
                <label className="block text-sm font-medium mb-1 text-gray-700 dark:text-gray-300">{label} {required && <span className="text-red-500">*</span>}</label>
                {type === 'select' ? (
                    <select name={name} value={value || ''} onChange={onChange} required={required}
                        className="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-sm bg-white dark:bg-gray-800 focus:outline-none focus:border-pbi-primary focus:ring-1">
                        <option value="">-- Sila Pilih --</option>
                        {options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                    </select>
                ) : type === 'textarea' ? (
                    <textarea name={name} value={value || ''} onChange={onChange} required={required} rows="3"
                        className="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-sm bg-white dark:bg-gray-800 focus:outline-none focus:border-pbi-primary focus:ring-1"></textarea>
                ) : (
                    <input type={type} name={name} value={value || ''} onChange={onChange} required={required}
                        className="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-sm bg-white dark:bg-gray-800 focus:outline-none focus:border-pbi-primary focus:ring-1" />
                )}
            </div>
        );

        const FilterBar = ({ companies, statuses, filterCompany, setFilterCompany, filterStatus, setFilterStatus }) => (
            <div className="flex flex-col md:flex-row gap-4 mb-4 bg-white dark:bg-gray-800 p-4 rounded-sm pbi-shadow border border-gray-200 dark:border-gray-700">
                <div className="flex-1">
                    <label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Tapis Syarikat / Agensi</label>
                    <select value={filterCompany} onChange={(e) => setFilterCompany(e.target.value)} className="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-sm bg-white dark:bg-gray-800 text-sm">
                        <option value="">Semua Syarikat</option>
                        {companies.map(c => <option key={c} value={c}>{c}</option>)}
                    </select>
                </div>
                {statuses && (
                    <div className="flex-1">
                        <label className="block text-xs font-semibold text-gray-500 uppercase mb-1">Tapis Status</label>
                        <select value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)} className="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-sm bg-white dark:bg-gray-800 text-sm">
                            <option value="">Semua Status</option>
                            {statuses.map(s => <option key={s} value={s}>{s}</option>)}
                        </select>
                    </div>
                )}
            </div>
        );

        const ClientFormModal = ({ isOpen, onClose, onSave, initialData }) => {
            const [formData, setFormData] = useState({});
            useEffect(() => { 
                if (initialData) {
                    const cleanedData = {};
                    Object.keys(initialData).forEach(key => {
                        cleanedData[key] = cleanArrayString(initialData[key]);
                        if (cleanedData[key] === '-') cleanedData[key] = ''; // kosongkan jika sengkang
                    });
                    setFormData(cleanedData); 
                } else {
                    setFormData({}); 
                }
            }, [initialData, isOpen]);

            const handleChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });
            
            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.company) return;
                onSave(formData);
                onClose();
            };

            return (
                <Modal isOpen={isOpen} onClose={onClose} title={initialData?.company ? "Kemaskini Maklumat Klien" : "Tambah Klien Baharu"} zIndex="z-[60]">
                    <form onSubmit={handleSubmit}>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="md:col-span-2">
                                <InputGroup label="Nama Syarikat / Agensi" name="company" value={formData.company} onChange={handleChange} required />
                            </div>
                            <div className="md:col-span-2">
                                <InputGroup label="Alamat Penuh" type="textarea" name="address" value={formData.address} onChange={handleChange} />
                            </div>
                            <InputGroup label="Cawangan / Lokasi" name="branch" value={formData.branch} onChange={handleChange} />
                            <InputGroup label="Nama PIC (Person In Charge)" name="picName" value={formData.picName} onChange={handleChange} />
                            <InputGroup label="No. Tel (Pejabat)" name="telOffice" value={formData.telOffice} onChange={handleChange} />
                            <InputGroup label="No. Tel (Bimbit / Mobile)" name="telMobile" value={formData.telMobile} onChange={handleChange} />
                            <InputGroup label="Alamat Emel" type="email" name="email" value={formData.email} onChange={handleChange} />
                            <InputGroup label="Pautan Portal (URL)" name="portalLink" value={formData.portalLink} onChange={handleChange} />
                            <InputGroup label="Nama Pengguna (Username)" name="username" value={formData.username} onChange={handleChange} />
                            <InputGroup label="Kata Laluan (Password)" name="password" value={formData.password} onChange={handleChange} />
                        </div>
                        <div className="mt-6 flex justify-end">
                            <button type="button" onClick={onClose} className="mr-3 px-4 py-2 border border-gray-300 rounded-sm hover:bg-gray-100 dark:hover:bg-gray-800">Batal</button>
                            <button type="submit" className="px-4 py-2 bg-pbi-primary text-white rounded-sm hover:bg-blue-600">Simpan Klien</button>
                        </div>
                    </form>
                </Modal>
            );
        };

        const ClientReferences = ({ clients, onSaveClient }) => {
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [selectedClient, setSelectedClient] = useState(null);
            const [filterCompany, setFilterCompany] = useState('');

            const uniqueCompanies = [...new Set(clients.map(c => c.company))].filter(Boolean);
            const displayClients = clients.filter(c => filterCompany ? c.company === filterCompany : true);

            const handleOpenModal = (client = null) => {
                setSelectedClient(client);
                setIsModalOpen(true);
            };

            return (
                <div className="animate-fade-in">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-semibold">Client References</h2>
                        <button onClick={() => handleOpenModal()} className="bg-pbi-primary hover:bg-blue-600 text-white px-4 py-2 rounded-sm text-sm font-medium transition-colors">
                            + Tambah Klien
                        </button>
                    </div>

                    <FilterBar companies={uniqueCompanies} filterCompany={filterCompany} setFilterCompany={setFilterCompany} />

                    <div className="bg-pbi-cardLight dark:bg-pbi-cardDark rounded-sm pbi-shadow overflow-x-auto">
                        <table className="w-full text-left text-sm whitespace-nowrap">
                            <thead className="bg-gray-100 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
                                <tr>
                                    <th className="p-3 font-semibold">Syarikat / Agensi</th>
                                    <th className="p-3 font-semibold">Cawangan</th>
                                    <th className="p-3 font-semibold">PIC Name</th>
                                    <th className="p-3 font-semibold">No. Telefon</th>
                                    <th className="p-3 font-semibold">Tindakan</th>
                                </tr>
                            </thead>
                            <tbody>
                                {displayClients.map((client, idx) => (
                                    <tr key={idx} className={`border-b border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700/50 ${idx % 2 === 0 ? '' : 'bg-gray-50/50 dark:bg-gray-800/30'}`}>
                                        <td className="p-3 font-medium text-pbi-primary">{cleanArrayString(client.company)}</td>
                                        <td className="p-3">{cleanArrayString(client.branch)}</td>
                                        <td className="p-3">{cleanArrayString(client.picName)}</td>
                                        <td className="p-3">{cleanArrayString(client.telMobile) !== '-' ? cleanArrayString(client.telMobile) : cleanArrayString(client.telOffice)}</td>
                                        <td className="p-3">
                                            <button onClick={() => handleOpenModal(client)} className="text-pbi-primary hover:underline text-sm font-medium">Lihat & Kemaskini</button>
                                        </td>
                                    </tr>
                                ))}
                                {displayClients.length === 0 && (
                                    <tr><td colSpan="5" className="p-4 text-center text-gray-500">Tiada rekod rujukan klien dijumpai.</td></tr>
                                )}
                            </tbody>
                        </table>
                    </div>

                    <ClientFormModal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} onSave={onSaveClient} initialData={selectedClient} />
                </div>
            );
        };

        const Dashboard = ({ jobs }) => {
            const processedJobs = jobs.map(job => ({
                ...job,
                dynamicCollectionStatus: calculateClaimStatus(job.invoiceDate, job.collectionStatus)
            }));
            const totalSales = processedJobs.reduce((sum, job) => job.collectionStatus === 'Payment Received' ? sum + Number(job.amountCollection || 0) : sum, 0);
            const outstandingAmount = processedJobs.reduce((sum, job) => job.dynamicCollectionStatus === 'Outstanding' ? sum + Number(job.quotationAmount || 0) : sum, 0);
            const activeJobs = processedJobs.filter(j => j.intakeStatus === 'Proceed' && j.operationStatus !== 'Completed').length;
            const completedJobs = processedJobs.filter(j => j.operationStatus === 'Completed').length;

            const statusData = [
                { name: 'Pending Intake', value: processedJobs.filter(j => j.intakeStatus === 'Pending').length },
                { name: 'In Progress', value: activeJobs },
                { name: 'Completed/Claim', value: completedJobs },
            ];
            const COLORS = ['#f2c80f', '#118dff', '#12a89d'];

            const agencyDataMap = {};
            processedJobs.forEach(job => {
                if (!agencyDataMap[job.company]) agencyDataMap[job.company] = 0;
                agencyDataMap[job.company] += Number(job.quotationAmount || 0);
            });
            const agencyData = Object.keys(agencyDataMap).map(key => ({ name: key, Quotation: agencyDataMap[key] }));

            return (
                <div className="space-y-6 animate-fade-in">
                    <h2 className="text-2xl font-semibold mb-6">Executive Dashboard</h2>
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div className="bg-pbi-cardLight dark:bg-pbi-cardDark p-4 rounded-sm pbi-shadow border-l-4 border-pbi-success">
                            <p className="text-sm text-gray-500">Total Kutipan Diterima</p>
                            <h3 className="text-2xl font-bold mt-1">RM {totalSales.toLocaleString()}</h3>
                        </div>
                        <div className="bg-pbi-cardLight dark:bg-pbi-cardDark p-4 rounded-sm pbi-shadow border-l-4 border-pbi-danger">
                            <p className="text-sm text-gray-500">Outstanding (&gt; 7 Hari)</p>
                            <h3 className="text-2xl font-bold mt-1">RM {outstandingAmount.toLocaleString()}</h3>
                        </div>
                        <div className="bg-pbi-cardLight dark:bg-pbi-cardDark p-4 rounded-sm pbi-shadow border-l-4 border-pbi-primary">
                            <p className="text-sm text-gray-500">Job Dalam Proses (Operation)</p>
                            <h3 className="text-2xl font-bold mt-1">{activeJobs}</h3>
                        </div>
                        <div className="bg-pbi-cardLight dark:bg-pbi-cardDark p-4 rounded-sm pbi-shadow border-l-4 border-pbi-warning">
                            <p className="text-sm text-gray-500">Job Selesai (Menunggu Bayaran)</p>
                            <h3 className="text-2xl font-bold mt-1">{completedJobs}</h3>
                        </div>
                    </div>
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-pbi-cardLight dark:bg-pbi-cardDark p-4 rounded-sm pbi-shadow h-80 flex flex-col">
                            <h3 className="text-sm font-semibold mb-4 text-center">Status Job Keseluruhan</h3>
                            <div className="flex-1 w-full h-full min-h-[200px]">
                                {chartsAvailable && (
                                    <ResponsiveContainer width="100%" height="100%">
                                        <PieChart>
                                            <Pie data={statusData} cx="50%" cy="50%" innerRadius={60} outerRadius={80} paddingAngle={5} dataKey="value" label>

            useEffect(() => { document.documentElement.classList.toggle('dark', isDarkMode); }, [isDarkMode]);

            useEffect(() => {
                if (!APPSCRIPT_URL) return;
                const fetchData = async () => {
                    setIsLoading(true);
                    try {
                        const response = await fetch(APPSCRIPT_URL);
                        const data = await response.json();
                        // Handle format JSON baru: { jobs: [...], clients: [...] }
                        if (data && !Array.isArray(data)) {
                            setJobs(data.jobs || []);
                            setClients(data.clients || []);
                        } else if (Array.isArray(data)) {
                            // Fallback jika backend lambat update (hanya return jobs)
                            setJobs(data);
                        }
                    } catch (error) {
                        console.error("Gagal menarik data dari Google Sheets:", error);
                    } finally {
                        setIsLoading(false);
                    }
                };
                fetchData();
            }, []);

            // Fungsi berpusat untuk simpan Job atau Client
            const saveDataToDB = async (payload, type = 'job') => {
                const dataToSave = { ...payload, type };
                
                // Optimistic UI Update
                if (type === 'job') {
                    const exists = jobs.find(j => j.quotationNumber === payload.quotationNumber);
                    setJobs(exists ? jobs.map(j => j.quotationNumber === payload.quotationNumber ? payload : j) : [payload, ...jobs]);
                } else if (type === 'client') {
                    const exists = clients.find(c => c.company === payload.company);
                    setClients(exists ? clients.map(c => c.company === payload.company ? payload : c) : [payload, ...clients]);
                }

                if (APPSCRIPT_URL) {
                    try {
                        await fetch(APPSCRIPT_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify(dataToSave)
                        });
                    } catch (error) {
                        console.error("Gagal hantar data ke Google Sheets:", error);
                        alert("Gagal menyelaraskan data. Sila semak internet anda.");
                    }
                }
            };

                { id: 'references', label: 'Client References', icon: IconUsers },
                { id: 'intake', label: 'Job Intake', icon: IconIntake },
                { id: 'operation', label: 'Operation', icon: IconOperation },
                { id: 'claim', label: 'Report & Claim', icon: IconClaim },

                <div className="h-full w-full flex flex-col md:flex-row bg-pbi-light dark:bg-pbi-dark relative overflow-hidden">

                            <img src="https://i.postimg.cc/Jzd5bvTC/image.png" alt="Prima First Auto Logo" className="w-8 h-8 rounded-full object-cover shadow-sm" />
                            <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pbi-primary to-blue-400">E-Perolehan</h1>
                        </div>
                        <button onClick={() => setIsDarkMode(!isDarkMode)} className="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-gray-700 transition text-gray-500">
                            {isDarkMode ? <IconSun /> : <IconMoon />}
                        </button>
                    </div>

                    <aside className={`hidden md:flex flex-col bg-pbi-cardLight dark:bg-pbi-cardDark border-r border-gray-200 dark:border-gray-800 flex-shrink-0 z-10 pbi-shadow transition-all duration-300 h-full ${isSidebarCollapsed ? 'w-20' : 'w-64'}`}>
                        <div className={`p-4 border-b border-gray-200 dark:border-gray-800 flex items-center ${isSidebarCollapsed ? 'justify-center' : 'justify-between'}`}>
                            {!isSidebarCollapsed && (
                                <div className="flex items-center space-x-3 overflow-hidden">
                                    <img src="https://i.postimg.cc/Jzd5bvTC/image.png" alt="Prima First Auto Logo" className="w-8 h-8 rounded-full object-cover flex-shrink-0 shadow-sm" />
                                    <h1 className="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-pbi-primary to-blue-400 truncate">E-Perolehan</h1>
                                </div>
                            )}
                            <button onClick={() => setIsSidebarCollapsed(!isSidebarCollapsed)} className="p-2 rounded-sm hover:bg-gray-100 dark:hover:bg-gray-700 transition text-gray-500"><IconMenu /></button>
                        </div>
                        <nav className="p-4 space-y-2 flex-1">
                            {tabs.map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)} title={isSidebarCollapsed ? tab.label : ''} className={`w-full flex items-center ${isSidebarCollapsed ? 'justify-center' : 'space-x-3'} px-3 py-2.5 rounded-sm transition-colors text-sm font-medium ${activeTab === tab.id ? 'bg-pbi-primary/10 text-pbi-primary border-l-4 border-pbi-primary' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 border-l-4 border-transparent'}`}>
                                    <tab.icon />{!isSidebarCollapsed && <span>{tab.label}</span>}
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-gray-200 dark:border-gray-800">
                            <button onClick={() => setIsDarkMode(!isDarkMode)} className={`w-full flex items-center ${isSidebarCollapsed ? 'justify-center' : 'space-x-3'} p-2 rounded-sm hover:bg-gray-100 dark:hover:bg-gray-700 transition text-gray-500`}>
                                {isDarkMode ? <IconSun /> : <IconMoon />}
                                {!isSidebarCollapsed && <span className="text-sm font-medium">{isDarkMode ? 'Mod Terang' : 'Mod Gelap'}</span>}
                            </button>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-y-auto relative z-0 pb-16 md:pb-0">
                        <div className="flex-1 p-4 md:p-8 flex flex-col">
                            <header className="mb-8 flex justify-between items-center">
                                <div>
                                    <h2 className="text-gray-500 dark:text-gray-400 text-sm font-semibold uppercase tracking-wider">Workspace</h2>
                                    <div className="flex items-center space-x-3">
                                        <h1 className="text-2xl md:text-3xl font-bold">{tabs.find(t => t.id === activeTab)?.label}</h1>
                                        {isLoading && <span className="text-xs bg-pbi-primary text-white px-2 py-1 rounded-sm animate-pulse">Syncing...</span>}
                                    </div>
                                </div>
                                <div className="flex items-center space-x-3">
                                    <div className="text-right hidden sm:block">
                                        <p className="text-sm font-bold">Admin Portal</p>
                                        <p className="text-xs text-gray-500">Prima First Auto</p>
                                    </div>
                                    <div className="h-10 w-10 rounded-full bg-white dark:bg-gray-800 flex items-center justify-center border-2 border-gray-200 dark:border-gray-700 overflow-hidden shadow-sm">
                                        <img src="https://i.postimg.cc/Jzd5bvTC/image.png" alt="Admin Profile" className="w-full h-full object-cover" />
                                    </div>
                                </div>
                            </header>

                            <div className="max-w-7xl mx-auto w-full flex-1">
                                {activeTab === 'dashboard' && <Dashboard jobs={jobs} />}
                                {activeTab === 'references' && <ClientReferences clients={clients} onSaveClient={(data) => saveDataToDB(data, 'client')} />}
                                {activeTab === 'intake' && <JobIntake jobs={jobs} clients={clients} onSaveJob={(data) => saveDataToDB(data, 'job')} onSaveClient={(data) => saveDataToDB(data, 'client')} />}
                                {activeTab === 'operation' && <Operation jobs={jobs} onSaveJob={(data) => saveDataToDB(data, 'job')} />}
                                {activeTab === 'claim' && <ReportClaim jobs={jobs} onSaveJob={(data) => saveDataToDB(data, 'job')} />}
                            </div>
                        </div>
                        <footer className="py-6 text-center text-sm text-gray-500 dark:text-gray-400 border-t border-gray-200 dark:border-gray-800 bg-pbi-cardLight dark:bg-pbi-cardDark mt-auto shrink-0">
                            Copyright &copy; {new Date().getFullYear()} E Perolehan Prima First Auto Sdn Bhd.
                        </footer>
                    </main>

                    <nav className="md:hidden absolute bottom-0 left-0 right-0 w-full bg-pbi-cardLight dark:bg-pbi-cardDark border-t border-gray-200 dark:border-gray-800 z-50 flex justify-around items-center pbi-shadow pb-2 pt-2">
                        {tabs.map(tab => (
                            <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex flex-col items-center justify-center w-full transition-colors ${activeTab === tab.id ? 'text-pbi-primary' : 'text-gray-500 hover:text-gray-900 dark:hover:text-white'}`}>
                                <div className={`p-1.5 rounded-full ${activeTab === tab.id ? 'bg-pbi-primary/10' : ''}`}><tab.icon /></div>
                                <span className={`text-[10px] mt-0.5 font-medium ${activeTab === tab.id ? 'font-bold' : ''}`}>{tab.label}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        };

        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<ErrorBoundary><App /></ErrorBoundary>);
            document.getElementById('boot-loader').style.display = 'none';
        } catch (err) {
            document.getElementById('boot-loader').style.display = 'none';
            document.getElementById('boot-error-detail').textContent = String(err && err.message || err);
            document.getElementById('boot-error').style.display = 'block';
        }
    </script>
</body>
</html>
